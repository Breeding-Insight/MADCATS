[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "madcats"
dynamic = ["version"]
description = "Marker-Anchored Discovery and Counting of Alleles from Targeted Sequencing: FASTQ to MADC microhaplotype count tables"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Sandercock" }]
keywords = [
    "genomics",
    "genotyping",
    "microhaplotype",
    "amplicon",
    "targeted-sequencing",
    "DArTag",
    "MADC",
    "polyploid",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Breeding-Insight/MADCATS"
Documentation = "https://madcats.readthedocs.io"
Source = "https://github.com/Breeding-Insight/MADCATS"
Issues = "https://github.com/Breeding-Insight/MADCATS/issues"
Changelog = "https://madcats.readthedocs.io/en/latest/development/changelog.html"

[project.scripts]
madcats = "madcats:main"

[tool.setuptools]
py-modules = ["madcats"]

[tool.setuptools.dynamic]
version = { attr = "madcats.__version__" }
